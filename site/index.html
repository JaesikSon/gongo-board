<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공 매각공고 모아보기</title>
<meta name="description" content="온비드·LH·SH·도시공사 매각공고를 하루 2회 모아 보여줍니다">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#6b6f76; --line:#e4e2dc;
  --accent:#1f5f4a; --accent-soft:#e3efe9; --warn:#b3452b; --warn-soft:#f8e6e0;
  --new:#2b59c3; --new-soft:#e5ecfb; --chip:#efeee9;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141517;--panel:#1c1e21;--ink:#e9e8e4;--muted:#9a9ea5;--line:#2c2f33;
  --accent:#6fc2a2;--accent-soft:#1f3029;--warn:#f08a70;--warn-soft:#3a241e;--new:#8fb0ff;--new-soft:#1f2740;--chip:#26292d}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif}
a{color:inherit}
header{padding:28px 20px 12px;max-width:1180px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.sub b{color:var(--ink);font-weight:500}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.tabs{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;color:var(--ink)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.65;margin-left:4px;font-size:13px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;
  grid-template-columns:2fr repeat(4,1fr);gap:8px}
.filters input,.filters select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.toggles{display:flex;gap:14px;flex-wrap:wrap;grid-column:1/-1;font-size:14px;color:var(--muted);align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.filters .toggles input[type=checkbox]{width:auto;margin:0;accent-color:var(--accent)}
.toggles .sp{flex:1}
.price{display:flex;gap:6px;align-items:center}
.price input{width:110px}
.count{margin:14px 2px 8px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 18px}
.card:hover{border-color:var(--muted)}
.t{font-weight:500;font-size:15.5px;text-decoration:none;line-height:1.4}
.t:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13.5px;display:flex;gap:4px 12px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--muted)}
.chip.org{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--new-soft);color:var(--new);font-weight:500}
.chip.hot{background:var(--warn-soft);color:var(--warn);font-weight:500}
.right{text-align:right;white-space:nowrap}
.money{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dday{font-weight:500}
.dday.hot{color:var(--warn)}
.more{margin:14px auto;display:block;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
details.status{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.status summary{cursor:pointer;font-weight:500}
.st{display:grid;grid-template-columns:18px 190px 1fr;gap:6px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.st:first-of-type{border-top:0}
.ok{color:var(--accent)} .bad{color:var(--warn)}
footer{color:var(--muted);font-size:12.5px;margin-top:18px;line-height:1.6}
@media (max-width:760px){
  header{padding:20px 16px 8px}.wrap{padding:0 16px 50px}
  .filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}
  .card{grid-template-columns:1fr}.right{text-align:left;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .st{grid-template-columns:18px 1fr}.st .m{grid-column:2}
}
</style>
</head>
<body>
<header>
  <h1>공공 매각공고 모아보기</h1>
  <div class="sub" id="sub">불러오는 중…</div>
</header>
<div class="wrap">
  <div class="tabs" role="group" aria-label="구분">
    <button class="tab" data-tab="all" aria-pressed="true">전체<span class="n" id="n-all"></span></button>
    <button class="tab" data-tab="물건" aria-pressed="false">온비드 물건<span class="n" id="n-thing"></span></button>
    <button class="tab" data-tab="공고" aria-pressed="false">LH·SH·공사 공고<span class="n" id="n-notice"></span></button>
  </div>

  <div class="filters">
    <input class="q" id="q" type="search" placeholder="검색: 주소, 물건명, 기관명 (예: 동탄 상업용지)">
    <select id="sido"><option value="">전체 지역</option></select>
    <select id="ot"><option value="">전체 기관유형</option></select>
    <select id="prpt"><option value="">전체 재산유형</option></select>
    <select id="sort">
      <option value="end">마감 임박순</option>
      <option value="new">최근 등록순</option>
      <option value="low">최저가 낮은순</option>
      <option value="high">최저가 높은순</option>
      <option value="ratio">감정가 대비 낮은순</option>
    </select>
    <div class="toggles">
      <label><input type="checkbox" id="onlyNew"> 신규만</label>
      <label><input type="checkbox" id="soon"> 7일 내 마감</label>
      <label><input type="checkbox" id="hidePvct" checked> 수의계약 물건 숨기기</label>
      <span class="sp"></span>
      <span class="price">최저가 <input id="pmin" type="number" inputmode="numeric" placeholder="최소(만원)"> ~ <input id="pmax" type="number" inputmode="numeric" placeholder="최대(만원)"></span>
    </div>
  </div>

  <div class="count"><span id="count"></span><span id="org-note"></span></div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>더 보기</button>

  <details class="status" id="status"><summary>수집 상태</summary><div id="st"></div></details>
  <footer>
    매일 오전 8시·오후 6시(한국시간)에 자동 갱신됩니다. 출처: 온비드 OpenAPI(한국자산관리공사), LH 분양임대공고 OpenAPI, 각 기관 홈페이지 게시판.
    공고 내용은 요약 정보이며, 입찰 전 반드시 원문 공고를 확인하세요. 실제 입찰은 각 기관·온비드에서 진행됩니다.
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const PAGE = 60;
let DATA = {items:[], statuses:[]}, tab = 'all', shown = PAGE;

const won = v => {
  if (v == null || v === '') return '';
  if (v >= 1e8) { const e = v / 1e8; return (e >= 100 ? Math.round(e).toLocaleString() : e.toFixed(e % 1 ? 2 : 0).replace(/\.?0+$/,'')) + '억'; }
  if (v >= 1e4) return Math.round(v / 1e4).toLocaleString() + '만';
  return v.toLocaleString() + '원';
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
function dday(end){
  if (!end) return null;
  const d = new Date(end.slice(0,10) + 'T00:00:00+09:00'), t = new Date(todayStr() + 'T00:00:00+09:00');
  return Math.round((d - t) / 864e5);
}
const isNew = r => DATA.updated && r.first_seen === DATA.updated && DATA.new_count > 0;

function fillSelect(id, values){
  const el = $('#'+id), cur = el.value;
  const counts = {};
  values.forEach(v => { if (v) counts[v] = (counts[v]||0) + 1; });
  const first = el.options[0].outerHTML;
  el.innerHTML = first + Object.entries(counts).sort((a,b)=>b[1]-a[1])
    .map(([v,n]) => `<option value="${esc(v)}">${esc(v)} (${n.toLocaleString()})</option>`).join('');
  el.value = cur;
}

function filtered(){
  const q = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const sido = $('#sido').value, ot = $('#ot').value, prpt = $('#prpt').value;
  const onlyNew = $('#onlyNew').checked, soon = $('#soon').checked, hidePvct = $('#hidePvct').checked;
  const pmin = +$('#pmin').value * 1e4 || 0, pmax = +$('#pmax').value * 1e4 || Infinity;
  let rows = DATA.items.filter(r =>
    (tab === 'all' || r.kind === tab) &&
    (!sido || r.sido === sido) && (!ot || r.ot === ot) && (!prpt || r.prpt === prpt) &&
    (!onlyNew || isNew(r)) && (!hidePvct || !r.pvct) &&
    (!soon || (dday(r.end) !== null && dday(r.end) <= 7)) &&
    ((pmin === 0 && pmax === Infinity) || (r.minp != null && r.minp >= pmin && r.minp <= pmax)) &&
    (!q.length || q.every(w => (r._hay ||= [r.title,r.addr,r.org,r.usage,r.src,r.sgg].join(' ').toLowerCase()).includes(w)))
  );
  const s = $('#sort').value;
  const by = {
    end: (a,b) => (a.end||'9999').localeCompare(b.end||'9999'),
    new: (a,b) => (b.first_seen||'').localeCompare(a.first_seen||'') || (b.posted||b.bgn||'').localeCompare(a.posted||a.bgn||''),
    low: (a,b) => (a.minp ?? 1e18) - (b.minp ?? 1e18),
    high: (a,b) => (b.minp ?? -1) - (a.minp ?? -1),
    ratio: (a,b) => (a.ratio ?? 999) - (b.ratio ?? 999),
  }[s];
  return rows.sort(by);
}

function card(r){
  const dd = dday(r.end), hot = dd !== null && dd <= 3;
  const chips = [
    isNew(r) ? '<span class="chip new">신규</span>' : '',
    `<span class="chip org">${esc(r.ot || r.src)}</span>`,
    r.sido ? `<span class="chip">${esc(r.sido)}</span>` : '',
    r.prpt ? `<span class="chip">${esc(r.prpt)}</span>` : '',
    r.usage && r.usage !== r.prpt ? `<span class="chip">${esc(r.usage)}</span>` : '',
    r.status ? `<span class="chip${r.status.includes('진행')||r.status.includes('공고중')?' hot':''}">${esc(r.status)}</span>` : '',
    r.fails ? `<span class="chip">유찰 ${r.fails}회</span>` : '',
  ].join('');
  const meta = [
    r.org && r.org !== r.src ? esc(r.org) : esc(r.src),
    r.kind === '물건' && r.addr && r.addr !== r.title ? esc(r.addr) : '',
    r.area ? `${r.area.toLocaleString()}㎡ (${Math.round(r.area*0.3025).toLocaleString()}평)` : '',
    r.bgn ? `입찰 ${esc(r.bgn.slice(5))} ~ ${esc((r.end||'').slice(5))}` : (r.posted ? `게시 ${esc(r.posted)}` : ''),
  ].filter(Boolean).map(x => `<span>${x}</span>`).join('');
  const right = r.minp
    ? `<div class="money">${won(r.minp)}</div><div class="small">감정가 ${won(r.apsl)}${r.ratio ? ` · ${r.ratio}%` : ''}</div>`
    : '';
  const dtxt = dd === null ? (r.kind === '물건' && !r.pvct ? '일정 미정' : '') : dd < 0 ? '' : dd === 0 ? '오늘 마감' : `D-${dd}`;
  return `<article class="card">
    <div><a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <div class="meta">${meta}</div><div class="chips">${chips}</div></div>
    <div class="right">${right}${dtxt ? `<div class="small dday${hot?' hot':''}">${dtxt}${r.end && r.end.length>10 ? ' '+esc(r.end.slice(11)) : ''}</div>` : ''}</div>
  </article>`;
}

function render(){
  const rows = filtered();
  $('#count').textContent = `${rows.length.toLocaleString()}건`;
  $('#list').innerHTML = rows.length ? rows.slice(0, shown).map(card).join('')
    : `<div class="empty">${DATA.items.length ? '조건에 맞는 공고가 없습니다.' : '아직 수집된 데이터가 없습니다. GitHub Actions에서 첫 수집이 끝나면 표시됩니다.'}</div>`;
  $('#more').hidden = rows.length <= shown;
  $('#more').textContent = `더 보기 (${(rows.length - shown).toLocaleString()}건 남음)`;
  const u = new URLSearchParams();
  ['q','sido','ot','prpt','sort'].forEach(k => { const v = $('#'+k).value; if (v && !(k==='sort'&&v==='end')) u.set(k,v); });
  if (tab !== 'all') u.set('tab', tab);
  history.replaceState(null, '', u.toString() ? '?' + u : location.pathname);
}

function renderStatus(){
  $('#st').innerHTML = (DATA.statuses||[]).map(s =>
    `<div class="st"><span class="${s.ok?'ok':'bad'}">${s.ok?'●':'○'}</span><span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</span><span class="m">${esc(s.message)}</span></div>`
  ).join('') || '<div class="small">아직 수집 기록이 없습니다.</div>';
}

async function load(){
  try {
    const r = await fetch('data/notices.json?t=' + Date.now());
    DATA = await r.json();
  } catch(e) { DATA = {items:[], statuses:[]}; }
  const items = DATA.items || [];
  const nThing = items.filter(r => r.kind === '물건').length, nNotice = items.length - nThing;
  $('#n-all').textContent = items.length.toLocaleString();
  $('#n-thing').textContent = nThing.toLocaleString();
  $('#n-notice').textContent = nNotice.toLocaleString();
  $('#sub').innerHTML = DATA.updated
    ? `마지막 갱신 <b>${esc(DATA.updated)}</b> · 진행 중 ${items.length.toLocaleString()}건${DATA.new_count ? ` · 이번 갱신 신규 <b>${DATA.new_count.toLocaleString()}</b>건` : ''}`
    : '첫 수집 전입니다';
  fillSelect('sido', items.map(r => r.sido));
  fillSelect('ot', items.map(r => r.ot));
  fillSelect('prpt', items.map(r => r.prpt));
  const p = new URLSearchParams(location.search);
  ['q','sido','ot','prpt','sort'].forEach(k => { if (p.get(k)) $('#'+k).value = p.get(k); });
  if (p.get('tab')) setTab(p.get('tab'), false);
  renderStatus(); render();
}

function setTab(t, r=true){
  tab = t; shown = PAGE;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === t));
  if (r) render();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
let timer;
['q','pmin','pmax'].forEach(id => $('#'+id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { shown = PAGE; render(); }, 180); }));
['sido','ot','prpt','sort','onlyNew','soon','hidePvct'].forEach(id => $('#'+id).addEventListener('change', () => { shown = PAGE; render(); }));
$('#more').onclick = () => { shown += PAGE; render(); };
load();
</script>
</body>
</html>
