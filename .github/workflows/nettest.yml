name: 접속 테스트 (임시)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LH 첨부파일·브이월드 접속 확인
        run: |
          for u in "https://apply.lh.or.kr/lhapply/lhFile.do?fileid=68652027" "https://apply.lh.or.kr/lhapply/apply/wt/wrtanc/selectWrtancInfo.do?panId=BN-0008004&ccrCnntSysDsCd=01&uppAisTpCd=01&aisTpCd=01&mi=1062" "https://api.vworld.kr/" "https://api.anthropic.com/v1/messages"; do
            echo "PROBE $(curl -s -m 30 -o /tmp/o -w '%{http_code} %{size_download}' "$u") $u"
            head -c 8 /tmp/o | xxd | head -1 || true
          done
