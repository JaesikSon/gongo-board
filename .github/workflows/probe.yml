name: probe-sites
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: probe
        run: |
          cat > /tmp/p.py <<'PY'
          import json, re, requests, urllib3
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urllib3.disable_warnings()
          C = {
           "서울주택도시개발공사(SH)": ["i-sh.co.kr"],
           "과천도시공사": ["gcuc.or.kr"], "광명도시공사": ["gmuc.co.kr", "gmuc.or.kr"],
           "광주도시관리공사": ["gjuc.or.kr", "gjcmc.or.kr", "gjuc.co.kr"],
           "구리도시공사": ["guriuc.or.kr", "guric.or.kr"], "군포도시공사": ["gunpouc.or.kr"],
           "김포도시공사": ["guc.or.kr"], "남양주도시공사": ["ncuc.or.kr"], "부천도시공사": ["best.or.kr"],
           "성남도시개발공사": ["isdc.co.kr"], "수원도시공사": ["suwonudc.co.kr"], "시흥도시공사": ["shsi.or.kr"],
           "안산도시공사": ["ansanuc.net"], "안양도시공사": ["auc.or.kr"],
           "양주도시공사": ["yjuc.or.kr", "yangjuuc.or.kr", "yjcmc.or.kr"],
           "여주도시공사": ["yeojuuc.or.kr", "yjmc.or.kr", "yjcmc.or.kr", "yeoju-uc.or.kr"],
           "용인도시공사": ["yuc.co.kr"], "의왕도시공사": ["uuc.or.kr"],
           "의정부도시공사": ["ujbuc.or.kr", "uijeongbuuc.or.kr", "ucmc.or.kr", "uuco.or.kr"],
           "파주도시공사": ["pjuc.or.kr", "pajuuc.or.kr", "pjcmc.or.kr"], "평택도시공사": ["puc.or.kr"],
           "포천도시공사": ["pcuc.or.kr", "pocheonuc.or.kr", "pochunuc.or.kr"],
           "하남도시공사": ["huic.co.kr", "hnuc.or.kr"], "화성도시공사": ["hsuco.or.kr", "hsuc.or.kr", "hsucorp.or.kr"],
           "고양도시관리공사": ["gys.or.kr", "goyangcmc.or.kr"],
           "국가철도공단": ["kr.or.kr"], "한국철도공사(코레일)": ["info.korail.com", "korail.com"],
           "한국자산관리공사(캠코)": ["kamco.or.kr"], "한국수자원공사": ["kwater.or.kr"], "한국도로공사": ["ex.co.kr"],
          }
          KW = re.compile(r"공고|공지|분양|매각|사업|공모|입찰|토지|용지|공급")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Accept-Language": "ko-KR,ko"}
          out = {}
          for name, doms in C.items():
              res = []
              for d in doms:
                  for base in (f"https://www.{d}", f"https://{d}", f"http://www.{d}"):
                      try:
                          r = requests.get(base, headers=H, timeout=20, verify=False)
                          r.encoding = r.apparent_encoding if not r.encoding or r.encoding.lower() == "iso-8859-1" else r.encoding
                          s = BeautifulSoup(r.text, "html.parser")
                          links = []
                          for a in s.find_all("a"):
                              t = " ".join(a.get_text(" ", strip=True).split())
                              h = a.get("href") or ""
                              if t and KW.search(t) and len(t) < 30 and h and not h.startswith(("javascript:void", "#")):
                                  links.append([t, urljoin(r.url, h)])
                          seen = set(); links = [l for l in links if not (l[1] in seen or seen.add(l[1]))][:40]
                          res.append({"try": base, "status": r.status_code, "url": r.url, "title": (s.title.get_text(strip=True) if s.title else "")[:80], "bytes": len(r.text), "links": links})
                          break
                      except Exception as e:
                          res.append({"try": base, "err": f"{type(e).__name__}: {str(e)[:90]}"})
              out[name] = res
          json.dump(out, open("probe.json", "w"), ensure_ascii=False, indent=1)
          PY
          python /tmp/p.py
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p probe && mv probe.json probe/probe.json
          git add probe/probe.json && git commit -m "probe" && git pull --rebase -X theirs origin main && git push origin HEAD:main
